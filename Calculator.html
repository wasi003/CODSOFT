<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculator</title>
    <style>
        :root {
            --number: #0984e3;
            --operator: #00b894;
            --equals: #e17055;
            --special: #fdcb6e;
            --dark: #2d3436;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
        }
        .calculator {
            width: 260px;
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2), 0 0 0 5px white;
        }
        .display {
            background: var(--dark);
            height: 80px;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2);
        }
        .previous-operand {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
        }
        .current-operand {
            font-size: 1.8rem;
            color: white;
            font-weight: bold;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 50px;
            border: none;
            border-radius: 10px;
            font-size: 1.3rem;
            cursor: pointer;
            color: white;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }
        .number { background: var(--number); }
        .operator { background: var(--operator); }
        #equals { background: var(--equals); }
        .clear, .delete { background: var(--special); color: var(--dark); }
        .span-two { grid-column: span 2; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>
        <div class="buttons">
            <button class="span-two clear" id="clear">AC</button>
            <button class="delete" id="delete">DEL</button>
            <button class="operator" id="divide">÷</button>
            <button class="number" id="seven">7</button>
            <button class="number" id="eight">8</button>
            <button class="number" id="nine">9</button>
            <button class="operator" id="multiply">×</button>
            <button class="number" id="four">4</button>
            <button class="number" id="five">5</button>
            <button class="number" id="six">6</button>
            <button class="operator" id="subtract">-</button>
            <button class="number" id="one">1</button>
            <button class="number" id="two">2</button>
            <button class="number" id="three">3</button>
            <button class="operator" id="add">+</button>
            <button class="number" id="zero">0</button>
            <button class="number" id="decimal">.</button>
            <button class="span-two operator" id="equals">=</button>
        </div>
    </div>

    <script>
        class Calculator {
            constructor(prevEl, currEl) {
                this.prevEl = prevEl;
                this.currEl = currEl;
                this.clear();
            }
            clear() {
                this.curr = '0';
                this.prev = '';
                this.op = undefined;
            }
            delete() {
                this.curr = this.curr.toString().slice(0, -1) || '0';
            }
            appendNum(num) {
                if (num === '.' && this.curr.includes('.')) return;
                this.curr = this.curr === '0' && num !== '.' ? num : this.curr + num;
            }
            chooseOp(op) {
                if (this.curr === '0') return;
                if (this.prev !== '') this.compute();
                this.op = op;
                this.prev = this.curr;
                this.curr = '0';
            }
            compute() {
                let res;
                const p = parseFloat(this.prev);
                const c = parseFloat(this.curr);
                if (isNaN(p) || isNaN(c)) return;
                switch(this.op) {
                    case '+': res = p + c; break;
                    case '-': res = p - c; break;
                    case '×': res = p * c; break;
                    case '÷': res = p / c; break;
                    default: return;
                }
                this.curr = res;
                this.op = undefined;
                this.prev = '';
            }
            update() {
                this.currEl.innerText = this.curr;
                this.prevEl.innerText = this.op ? `${this.prev} ${this.op}` : '';
            }
        }

        const calc = new Calculator(
            document.getElementById('previous-operand'),
            document.getElementById('current-operand')
        );

        document.querySelectorAll('.number').forEach(b => {
            b.addEventListener('click', () => {
                calc.appendNum(b.innerText);
                calc.update();
            });
        });

        document.querySelectorAll('.operator').forEach(b => {
            if (b.id !== 'equals') {
                b.addEventListener('click', () => {
                    calc.chooseOp(b.innerText);
                    calc.update();
                });
            }
        });

        document.getElementById('equals').addEventListener('click', () => {
            calc.compute();
            calc.update();
        });

        document.getElementById('clear').addEventListener('click', () => {
            calc.clear();
            calc.update();
        });

        document.getElementById('delete').addEventListener('click', () => {
            calc.delete();
            calc.update();
        });

        document.addEventListener('keydown', (e) => {
            if (/[0-9.]/.test(e.key)) calc.appendNum(e.key);
            else if (/[+\-*/]/.test(e.key)) calc.chooseOp(e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key);
            else if (e.key === 'Enter' || e.key === '=') calc.compute();
            else if (e.key === 'Escape') calc.clear();
            else if (e.key === 'Backspace') calc.delete();
            calc.update();
        });
    </script>
</body>
</html>
